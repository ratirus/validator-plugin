<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>title</title>

    <script src="/js/jquery-1.12.3.min.js"></script>
    <script src="/js/validator.util.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/underscore.js/1.10.2/underscore-min.js"></script>
    <script>
        $(document).ready
        (
            function(){
                $("#regbutton").click
                (
                    function()
                    {
                        console.log('sub');
                        var form = $('#frm')[0];
                        form.submit();

                    }

                )
            }
        );
    </script>
</head>
<body>
    
    <form action="/board/register" method="post" name="frm" id="frm">
        <table>
            <tr>
                <td>제목</td>
                <td><input type="text" name="title" id="title" size="60"></td>
            </tr>
            <tr>
                <td>내용</td>
                <td>
                    <textarea name="contents" id="contents" cols="60" rows="20"></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="2"><button type="button" id="regbutton">등록</button></td>
            </tr>
        </table>
    </form>
</body>
</html>
